[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "Cython==3.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emoblocks-json-native"
version = "0.1.0"
description = "Optional byte-compatible native JSON encoder for EmoBlocks"
requires-python = ">=3.10"
dependencies = ["orjson==3.13.0"]
