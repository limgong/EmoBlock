services:
  caddy:
    image: public.ecr.aws/docker/library/caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    container_name: emoblocks-https-proxy
    network_mode: host
    restart: unless-stopped
    environment:
      DEMO_IP: ${DEMO_IP:?Set the public IPv4 address}
    volumes:
      - ./config:/etc/caddy:ro
      - ./acme:/srv/acme:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    mem_limit: 192m
    cpus: 1
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  certbot:
    profiles: [certificates]
    build:
      context: .
      dockerfile: Certbot.Dockerfile
      network: host
    image: emoblocks-certbot:5.8.0
    network_mode: host
    volumes:
      - ./acme:/srv/acme
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-work:/var/lib/letsencrypt
      - ./certbot-logs:/var/log/letsencrypt
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
