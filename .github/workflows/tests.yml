name: Cross-platform source tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        encoder: [stdlib, native]
    runs-on: ${{ matrix.os }}
    env:
      EMOBLOCKS_JSON_ENCODER: ${{ matrix.encoder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install ./native/json_codec
      - run: python scripts/check_frontends.py
      - run: python scripts/test.py --backend-only
      - run: python scripts/doctor.py
